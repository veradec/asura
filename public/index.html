<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asura</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    input, button { margin: 10px 0; display: block; }
    #progressContainer { width: 100%; background: #eee; border-radius: 5px; overflow: hidden; height: 20px; margin-bottom: 10px; }
    #progressBar { width: 0%; height: 100%; background: green; transition: width 0.2s; }
    details { margin-top: 20px; }
    summary { cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Asura</h1>

  <input type="file" id="fileInput">
  <div id="progressContainer"><div id="progressBar"></div></div>
  <button onclick="sendFile()">Send File</button>

  <details id="logDetails">
    <summary>Logs</summary>
    <div id="log"></div>
  </details>

  <script src="app.js"></script>
</body>
</html>
